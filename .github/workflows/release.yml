name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag against TOC version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          toc="$(sed -n 's/^## Version: *//p' WoWHeadShortcut.toc | tr -d '\r')"
          if [ "$tag" != "$toc" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match '## Version: $toc' in WoWHeadShortcut.toc"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      # git archive leaves out the export-ignore paths in .gitattributes.
      - name: Build zip
        run: |
          git archive --format=zip --prefix=WoWHeadShortcut/ \
            -o "WoWHeadShortcut-${{ steps.version.outputs.version }}.zip" HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "WoWHeadShortcut-${{ steps.version.outputs.version }}.zip" \
            --title "WoWHeadShortcut ${{ steps.version.outputs.version }}" \
            --generate-notes
